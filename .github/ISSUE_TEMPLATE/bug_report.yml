name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
- type: markdown
  attributes:
    value: |
      Thank you for contributing to Sharing!

      > [!IMPORTANT]
      > While we accept using AI to assist you in investigating an issue, we do not accept AI-rewritten issues. Write the issue yourself, in your own words.

      Keep the report as short as possible and focused only on the problem at hand. Do not include background, speculation, proposed solutions, or other unrelated details.

      Every bug report should include a complete, minimal SPM package or Xcode project that reproduces the problem. Attach the project to the **Reproducing project** field below.
- type: textarea
  attributes:
    label: Description
    description: |
      Briefly describe the incorrect behavior. Include only the details needed to understand the problem.

      If you think this issue has been recently introduced and did not occur in an earlier version, please note that. If possible, include the last version that the behavior was correct in addition to your current version.
    placeholder: A concise description of the problem.
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Checklist
    options:
    - label: I wrote this issue myself, in my own words, without AI-generated or AI-rewritten text.
      required: true
    - label: I have kept this report focused on the issue at hand and removed all unrelated details.
      required: true
    - label: I have attempted to create a complete, minimal SPM package or Xcode project that reproduces the problem.
      required: true
    - label: I have determined whether this bug is also reproducible in a vanilla SwiftUI project.
      required: false
    - label: If possible, I've reproduced the issue using the `main` branch of this package.
      required: false
    - label: This issue hasn't been addressed in an [existing GitHub issue](https://github.com/pointfreeco/swift-sharing/issues) or [discussion](https://github.com/pointfreeco/swift-sharing/discussions).
      required: true
- type: textarea
  attributes:
    label: Expected behavior
    description: Describe what you expected to happen.
  validations:
    required: false
- type: textarea
  attributes:
    label: Actual behavior
    description: Describe or copy/paste the behavior you observe.
  validations:
    required: false
- type: textarea
  attributes:
    label: Reproducing project
    description: |
      Attach a complete, minimal SPM package or Xcode project that demonstrates the problem. Remove all code and dependencies that are not needed to reproduce it.
    placeholder: |
      Drag and drop a zipped SPM package or Xcode project into this field.
  validations:
    required: false
- type: input
  attributes:
    label: Sharing version information
    description: The version of Sharing used to reproduce this issue.
    placeholder: "'1.0.0' for example, or a commit hash"
- type: input
  attributes:
    label: Destination operating system
    description: The OS running your application.
    placeholder: "'iOS 18' for example"
- type: input
  attributes:
    label: Xcode version information
    description: The version of Xcode used to reproduce this issue.
    placeholder: "The version displayed from 'Xcode 〉About Xcode'"
- type: textarea
  attributes:
    label: Swift Compiler version information
    description: The version of Swift used to reproduce this issue.
    placeholder: Output from 'xcrun swiftc --version'
    render: shell
